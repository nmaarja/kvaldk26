
<!doctype html>
<html>
<head>
    <title>Minu väike linn</title>

    <script>
        let g;

        // Linna objektide andmed
        let objektid = [
            ["maja", 30, 220, 0.6],
            ["maja", 145, 220, 1],
            ["maja", 280, 220, 1.5],
            ["puu", 100, 220, 0.8],
            ["puu", 245, 220, 1],
            ["puu", 440, 220, 1.2]
        ];

        // Maja joonistamine
        function joonistaMaja(x, y, suurus) {
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(x, y - 100 * suurus);
            g.lineTo(x + 40 * suurus, y - 150 * suurus);
            g.lineTo(x + 80 * suurus, y - 100 * suurus);
            g.lineTo(x + 80 * suurus, y);
            g.lineTo(x, y);
            g.stroke();

            // Uks
            g.beginPath();
            g.moveTo(x + 35 * suurus, y);
            g.lineTo(x + 35 * suurus, y - 50 * suurus);
            g.lineTo(x + 55 * suurus, y - 50 * suurus);
            g.lineTo(x + 55 * suurus, y);
            g.stroke();
        }

        // Puu joonistamine
        function joonistaPuu(x, y, suurus) {
            g.beginPath();
            g.arc(x, y - 65 * suurus, 25 * suurus, 0, 2 * Math.PI);
            g.stroke();

            // Tüvi
            g.beginPath();
            g.moveTo(x - 7 * suurus, y - 40 * suurus);
            g.lineTo(x - 7 * suurus, y);
            g.lineTo(x + 7 * suurus, y);
            g.lineTo(x + 7 * suurus, y - 40 * suurus);
            g.stroke();
        }

        // Joonistamine andmete põhjal
        function joonista() {
            let tahvel = document.getElementById("tahvel");
            g = tahvel.getContext("2d");

            g.clearRect(0, 0, tahvel.width, tahvel.height);
            g.lineWidth = 2;
            g.strokeStyle = "black";

            for (let i = 0; i < objektid.length; i++) {
                let d = objektid[i];

                let tyyp = d[0];
                let x = d[1];
                let y = d[2];
                let suurus = d[3];

                if (tyyp == "maja") {
                    joonistaMaja(x, y, suurus);
                }

                if (tyyp == "puu") {
                    joonistaPuu(x, y, suurus);
                }
            }
        }

        // Tabeli loomine
        function looTabel() {
            let tabel = document.getElementById("andmetabel");
            tabel.innerHTML = "";

            for (let d of objektid) {
                let rida = tabel.insertRow();

                for (let väärtus of d) {
                    let lahter = rida.insertCell();
                    lahter.textContent = väärtus;
                    lahter.contentEditable = true;
                }
            }
        }

        // Tabelist andmete lugemine
        function loeTabelist() {
            let read = document.querySelectorAll("#andmetabel tr");

            objektid = [];

            for (let rida of read) {
                let lahtrid = rida.querySelectorAll("td");

                let tyyp = lahtrid[0].textContent.trim();
                let x = Number(lahtrid[1].textContent);
                let y = Number(lahtrid[2].textContent);
                let suurus = Number(lahtrid[3].textContent);

                objektid.push([tyyp, x, y, suurus]);
            }

            joonista();
        }

        // Uue objekti lisamine
        function lisaObjekt() {
            let tyyp = document.getElementById("tyyp").value;
            let x = Number(document.getElementById("x").value);
            let y = Number(document.getElementById("y").value);
            let suurus = Number(document.getElementById("suurus").value);

            objektid.push([tyyp, x, y, suurus]);

            looTabel();
            joonista();
        }
        function uuendaAndmed(){
		  fetch("https://script.google.com/macros/s/AKfycbyO4RP-NRC8sgP4ilFQbrmEDBXve9kzIPBhq1vwa7vbMFdz1jTftfubTbQmS6a15Rq9mQ/exec").then(d => d.json()).then(loe);
	 	  }

        // Lehe käivitamine
        function alusta() {
            looTabel();
            joonista();
        }
    </script>
</head>

<body onload="alusta()">

    <h1>Minu väike linn</h1>

    <h3>Lisa linna uus objekt</h3>

    <select id="tyyp">
        <option value="maja">Maja</option>
        <option value="puu">Puu</option>
    </select>

    <label>X asukoht:</label>
    <input type="number" id="x" value="200">

    <label>Y asukoht:</label>
    <input type="number" id="y" value="220">

    <label>Suurus:</label>
    <input type="number" id="suurus" value="1" step="0.1">

    <button onclick="lisaObjekt()">Lisa objekt</button>

    <br><br>

    <canvas id="tahvel" width="600" height="500"></canvas>

    <h3>Linna objektide andmetabel</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Tüüp</th>
                <th>X</th>
                <th>Y</th>
                <th>Suurus</th>
            </tr>
        </thead>

        <tbody id="andmetabel" oninput="loeTabelist()">
        </tbody>
    </table>

</body>
</html>
