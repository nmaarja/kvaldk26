<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Väike linn</title>
    <script>
        let g
        let url = "https://script.google.com/macros/s/AKfycbxd2qbXNsVGIJntHmGki0mQR4i1ecVTbnhVNcly6LjG_zYoGlUq3ZPjuPGTO3d-w2C4/exec";
        // objektide andmed
        let objektid = [];
        let paringuLoendur = 0;
        
        // maja joonistamine
    function joonistaMaja(x, y, suurus) {
    // Maja seinad
    g.fillStyle = "#F2C078";
    g.strokeStyle = "black";
    g.lineWidth = 2;

    g.beginPath(); // alustab uue kujundi joonist
    g.moveTo(x, y);
    g.lineTo(x, y - 100 * suurus);
    g.lineTo(x + 40 * suurus, y - 150 * suurus);
    g.lineTo(x + 80 * suurus, y - 100 * suurus);
    g.lineTo(x + 80 * suurus, y);
    g.closePath();
    g.fill();
    g.stroke();

    // Katus
    g.fillStyle = "#A94438";
    g.beginPath();
    g.moveTo(x - 5 * suurus, y - 100 * suurus);
    g.lineTo(x + 40 * suurus, y - 155 * suurus);
    g.lineTo(x + 85 * suurus, y - 100 * suurus);
    g.closePath();
    g.fill();
    g.stroke();

    // Uks
    g.fillStyle = "#795548";
    g.fillRect(
        x + 35 * suurus,
        y - 50 * suurus,
        20 * suurus,
        50 * suurus
    );
    g.strokeRect(
        x + 35 * suurus,
        y - 50 * suurus,
        20 * suurus,
        50 * suurus
    );
}
        // puu
        function joonistaPuu(x, y, suurus) {
    // Puu võra
    g.fillStyle = "#4F8A45";
    g.strokeStyle = "black";
    g.lineWidth = 2;

    g.beginPath();
    g.arc(x, y - 65 * suurus, 25 * suurus, 0, 2 * Math.PI);
    g.fill();
    g.stroke();

    // Puu tüvi
    g.fillStyle = "#795548";
    g.fillRect(
        x - 7 * suurus,
        y - 40 * suurus,
        14 * suurus,
        40 * suurus
    );
    g.strokeRect(
        x - 7 * suurus,
        y - 40 * suurus,
        14 * suurus,
        40 * suurus
    );
}


        // Objektide joonistamine
        function joonista() {
            let tahvel = document.getElementById("tahvel");
            g = tahvel.getContext("2d");
            g.clearRect(0, 0, tahvel.width, tahvel.height);
            g.lineWidth = 2;
            g.strokeStyle = "black";

            for (let i = 0; i < objektid.length; i++) { //alustab esimesest objektist, kordab seni, kuni kõik objektid on läbi käidud ja suurendab loendurit iga kord ühe võrra.
                let d = objektid[i];
                let tyyp = d[0];
                let x = Number(d[1]);
                let y = Number(d[2]);
                let suurus = Number(d[3]);

                if (tyyp == "maja") {
                    joonistaMaja(x, y, suurus);
                }

                if (tyyp == "puu") {
                    joonistaPuu(x, y, suurus);
                }
            }
        }

        // pärin App Scripti
        function saadaPäring(parameetrid, tegevus) {
            let aadress = url; // salvestab sheetsi aadressi
            let lisa = new URLSearchParams(parameetrid); // muudab saadetavad andmed aadressile sobivaks kujuks

            if (lisa.toString()) { // kontrollib kas on andmeid, mida aadressile lisada
                aadress += "?" + lisa;
    }

    fetch(aadress).then(vastus => vastus.json()).then(andmed => tegevus(andmed));
}

        // andmed sheetsist
        function laeAndmed() { 
            document.getElementById("teade").textContent = "Laen andmeid...";
            saadaPäring({}, function(andmed) {
                objektid = andmed.slice(1);
                looTabel();
                joonista();

            document.getElementById("teade").textContent = "Andmed on laetud!";
            });
        }

        // tabel
        function looTabel() {
            let tabel = document.getElementById("andmetabel");
            tabel.innerHTML = "";

            for (let d of objektid) {
                let rida = tabel.insertRow();
                
                for (let väärtus of d) {
                    let lahter = rida.insertCell();
                    lahter.textContent = väärtus;
                }
            }
        }

        // uus objekt sheetsi
        function lisaObjekt() {
            let tyyp = document.getElementById("tyyp").value;
            let x = Number(document.getElementById("x").value);
            let y = Number(document.getElementById("y").value);
            let suurus = Number(document.getElementById("suurus").value);


            saadaPäring({
                tyyp: tyyp,
                x: x,
                y: y,
                suurus: suurus
            }, function(andmed) {
                objektid = andmed.slice(1);
                looTabel();
                joonista();
            });
        }

        // veebilehe käivitamine
        function alusta() {
            laeAndmed();
        }

    </script>
</head>
    
// veebilehe tööprotsess
<body onload="alusta()">
<p id="teade">Laen andmeid...</p>
    <h1>Väike linn</h1>

    <h3>Lisa linna uus objekt</h3>

    <select id="tyyp">
        <option value="maja">Maja</option>
        <option value="puu">Puu</option>
    </select>

    <label>X asukoht:</label>
    <input type="number" id="x" value="200">

    <label>Y asukoht:</label>
    <input type="number" id="y" value="220">

    <label>Suurus:</label>
    <input type="number" id="suurus" value="1" step="0.1">

    <button onclick="lisaObjekt()">Lisa objekt</button>

    <canvas id="tahvel" width="600" height="500"></canvas>

    <h3>Linna objektide andmetabel</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Tüüp</th>
                <th>X</th>
                <th>Y</th>
                <th>Suurus</th>
            </tr>
        </thead>

        <tbody id="andmetabel">
        </tbody>
    </table>

</body>
</html>
