
<!doctype html>
<html>
<head>
    <title>Minu väike linn</title>

    <script>
        let g;

        // Google Apps Scripti veebiaadress
        let url = "https://script.google.com/macros/s/AKfycbzNGjvsY22o4os_F40H2ZRqXJnnEAt0VIz6tNussJBT18ZlSlbkRnyGXqYXHVW3iO_GZw/exec";

        // Linna objektide andmed
        let objektid = [];

        // Maja joonistamine
        function joonistaMaja(x, y, suurus) {
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(x, y - 100 * suurus);
            g.lineTo(x + 40 * suurus, y - 150 * suurus);
            g.lineTo(x + 80 * suurus, y - 100 * suurus);
            g.lineTo(x + 80 * suurus, y);
            g.lineTo(x, y);
            g.stroke();

            // Uks
            g.beginPath();
            g.moveTo(x + 35 * suurus, y);
            g.lineTo(x + 35 * suurus, y - 50 * suurus);
            g.lineTo(x + 55 * suurus, y - 50 * suurus);
            g.lineTo(x + 55 * suurus, y);
            g.stroke();
        }

        // Puu joonistamine
        function joonistaPuu(x, y, suurus) {
            g.beginPath();
            g.arc(x, y - 65 * suurus, 25 * suurus, 0, 2 * Math.PI);
            g.stroke();

            // Tüvi
            g.beginPath();
            g.moveTo(x - 7 * suurus, y - 40 * suurus);
            g.lineTo(x - 7 * suurus, y);
            g.lineTo(x + 7 * suurus, y);
            g.lineTo(x + 7 * suurus, y - 40 * suurus);
            g.stroke();
        }

        // Joonistamine andmete põhjal
        function joonista() {
            let tahvel = document.getElementById("tahvel");
            g = tahvel.getContext("2d");

            g.clearRect(0, 0, tahvel.width, tahvel.height);
            g.lineWidth = 2;
            g.strokeStyle = "black";

            for (let i = 0; i < objektid.length; i++) {
                let d = objektid[i];

                let tyyp = d[0];
                let x = Number(d[1]);
                let y = Number(d[2]);
                let suurus = Number(d[3]);

                if (tyyp == "maja") {
                    joonistaMaja(x, y, suurus);
                }

                if (tyyp == "puu") {
                    joonistaPuu(x, y, suurus);
                }
            }
        }

        // Andmete pärimine Google Sheetsist
        function laeAndmed() {
            saadaPäring({}, function(andmed) {
                objektid = andmed;
                looTabel();
                joonista();
                document.getElementById("teade").textContent =
                    "Andmed laaditud Google Sheetsist!";
            });
        }

        // Päringu saatmine Apps Scriptile JSONP abil
        function saadaPäring(parameetrid, tegevus) {
            let nimi = "sheetCallback";

            window[nimi] = function(vastus) {
                delete window[nimi];
                script.remove();

                tegevus(vastus);
            };

            let aadress = url + "?callback=" + nimi;

            for (let võti in parameetrid) {
                aadress += "&" + encodeURIComponent(võti)
                    + "=" + encodeURIComponent(parameetrid[võti]);
            }

            let script = document.createElement("script");
            script.src = aadress;

            script.onerror = function() {
                document.getElementById("teade").textContent =
                    "Andmete laadimine ebaõnnestus. Kontrolli URL-i ja ühendust.";
                delete window[nimi];
                script.remove();
            };

            document.body.appendChild(script);
        }

        // Tabeli loomine
        function looTabel() {
            let tabel = document.getElementById("andmetabel");
            tabel.innerHTML = "";

            for (let d of objektid) {
                let rida = tabel.insertRow();

                for (let väärtus of d) {
                    let lahter = rida.insertCell();
                    lahter.textContent = väärtus;
                }
            }
        }

        // Uue objekti lisamine Google Sheetsi
        function lisaObjekt() {
            let tyyp = document.getElementById("tyyp").value;
            let x = Number(document.getElementById("x").value);
            let y = Number(document.getElementById("y").value);
            let suurus = Number(document.getElementById("suurus").value);

            if (!Number.isFinite(x) ||
                !Number.isFinite(y) ||
                !Number.isFinite(suurus) ||
                suurus <= 0) {

                document.getElementById("teade").textContent =
                    "Palun sisesta sobivad arvud ja positiivne suurus!";
                return;
            }

            document.getElementById("teade").textContent =
                "Salvestan uut objekti...";

            saadaPäring({
                action: "add",
                tyyp: tyyp,
                x: x,
                y: y,
                suurus: suurus
            }, function(vastus) {
                if (vastus.status == "ok") {
                    laeAndmed();
                } else {
                    document.getElementById("teade").textContent =
                        "Objekti salvestamine ebaõnnestus.";
                }
            });
        }

        // Lehe käivitamine
        function alusta() {
            laeAndmed();
        }
    </script>
</head>

<body onload="alusta()">

    <h1>Minu väike linn</h1>

    <h3>Lisa linna uus objekt</h3>

    <select id="tyyp">
        <option value="maja">Maja</option>
        <option value="puu">Puu</option>
    </select>

    <label>X asukoht:</label>
    <input type="number" id="x" value="200">

    <label>Y asukoht:</label>
    <input type="number" id="y" value="220">

    <label>Suurus:</label>
    <input type="number" id="suurus" value="1" step="0.1">

    <button onclick="lisaObjekt()">Lisa objekt</button>

    <p id="teade">Laen andmeid...</p>

    <br>

    <canvas id="tahvel" width="600" height="500"></canvas>

    <h3>Linna objektide andmetabel</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Tüüp</th>
                <th>X</th>
                <th>Y</th>
                <th>Suurus</th>
            </tr>
        </thead>

        <tbody id="andmetabel">
        </tbody>
    </table>

</body>
</html>
