<!doctype html>
<html>
  <head>
     <script>
        function kysi(){
          // vaadake, milliseid andmeid on wikidatas (P106)
          // võimaldage teisest rippmenüüst valida ametit
           let lause=`
             SELECT ?item ?itemLabel
              WHERE
              {
                ?item wdt:P27 wd:${riik.value}. 
                ?item wdt:P106 wd:Q177220.
              
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
                } 
              }
              LIMIT 10
           `;
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);      
           fetch(aadress).then(d => d.json()).then(kuva);
        }
       
  function kuva(d){
           console.log(d);
            vastus.innerHTML=""; // kustutab eelmised ära ja näitab ainult seda, mis küsin
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              //vastus.textContent+=" "+rida["itemLabel"]["value"];
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
  </head>
  <body>
      <select id="riik" onchange="kysi()">
        <option value="Q33">Soome</option>
        <option value="Q191">Eesti</option>
        <option value="Q183">Saksamaa</option>
        <option value="Q40">Austria</option>
      </select>
    <select>
    <option value="Q2066131">Sportlane</option>
    <option value="Q33999">Näitleja</option>
    <option value="Q36180">Kirjanik</option>
      </select>
     <input type="button" value="otsi" onclick="kysi()" />
     <ul id="vastus"></ul>
  </body>
</html>
