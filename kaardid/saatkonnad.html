<!DOCTYPE html>
<html>
 <head>
 <title>Kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
 <script>
   var kaart;
   var hypik;
   function algus(){
    kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);
      new L.TileLayer(  'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
	  attribution: "Map: <a  href='http://www.maaamet.ee/'>Maa-amet</a>",
	  tms: true,
    }).addTo(kaart);
	  fetch("https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQQg_FfvdL7YLJ57drgg2XebgMVrSuU8TzIU2FgBrfBZcLlq7mGaULC8YcHa6LShw_pnkBpMEjS4tiuoVn-u76nZl7lZEyabB3CuH-ASw2-MRynLe0Wenn4fLmw3sYM0BRaTjxvIRb0FTCh7mu3foiwHd6CEDVNc9mehozPFPY37DtTWrJP7iMpk105sDT-7iOeoR8KNUHF7BGVwDD7PenOEZIijtypaXK0MFuh4oE3farcfSn-4plKeh7RBSQF0nNpvnSBYGi3L4wgao5IUyflG36uHg&lib=M8ZViIZbCdEpkzghg2_YrkcOxMWIkuJkC"
		    ).then(d => d.json()).then(kuva);
  }
  
function kuva(kohad){
    var piirid = [];
    var punktid = [];

    for(let koht of kohad){
        L.marker([koht[0], koht[1]])
          .addTo(kaart)
          .bindPopup(koht[2]); // asukohale vajutades tuleb info

        piirid.push([koht[0], koht[1]]);
        punktid.push([koht[0], koht[1]]);
    }

    var ala = L.latLngBounds(piirid);

    ala = ala.pad(0.1);

    L.rectangle(ala, {
        color: "#90EE90",
        weight: 2,
        fillColor: "#90EE90",
        fillOpacity: 0.25
    }).addTo(kaart);

    L.polyline(punktid, {
        color: "blue",
        weight: 3
    }).addTo(kaart);
}
