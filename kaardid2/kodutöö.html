<!DOCTYPE html>
<html>
 <head>
 <title>Kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
 <script>
   var kaart;
   var hypik;
	var tabeliKohad = [];
	var grupp;
   function algus(){
    kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);
	hypik = L.marker([59.439, 24.773]);
    new L.TileLayer('https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
      {attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
        tms: true,}).addTo(kaart);
	grupp = L.layerGroup();
	grupp.addTo(kaart);

    kaart.on("click", vajutus);
	fetch("https://script.google.com/macros/s/AKfycbxp-TobJITs3Eehm8eJq5dj4DWbR7G_0jpgKEktHYYjgoXUrMyeVbtApr6wR2yHLV5h/exec").then(d => d.json()).then(kuva);
  	
   }
	 
  function kuva(kohad){

// tabelis olevad asukohad kaardile
    tabeliKohad = kohad;

    for(let koht of kohad){
        L.marker([koht[0], koht[1]]).addTo(kaart).bindPopup(koht[2]); // võtab tabelist asukohad, paneb kaardile ja lisab popup
    }
}
	  
function vajutus(e){

  // Valitud punkt
  hypik.setLatLng(e.latlng).addTo(kaart);

  // kustutab eelmise vajutuse jooned
  grupp.clearLayers();

  // joon vajutatud kohast iga tabelis oleva kohani
  for(let koht of tabeliKohad){
    L.polyline([e.latlng, [koht[0], koht[1]]]).addTo(grupp);
  }

  // Kaugused
  let tekst =
    "Sinu valitud koht:" +
    "<br>Laiuskraad: " + e.latlng.lat +
    "<br>Pikkuskraad: " + e.latlng.lng +
    "<br><br>";

  for(let koht of tabeliKohad){

    let kaugus = e.latlng.distanceTo(L.latLng(koht[0], koht[1]));

    tekst = tekst + "<b>" + koht[2] + "</b>: " + Math.round(kaugus) + " m<br>";
  }

  hypik.bindPopup(tekst).openPopup();

  // Andmed Sheetsi
  let lisand =
    "laiuskraad=" + e.latlng.lat +
    "&pikkuskraad=" + e.latlng.lng +
    "&tyyp=" + tyybivalik.value +
    "&kommentaar=" + encodeURI(kast1.value);
  fetch("https://script.google.com/macros/s/AKfycbxp-TobJITs3Eehm8eJq5dj4DWbR7G_0jpgKEktHYYjgoXUrMyeVbtApr6wR2yHLV5h/exec?" + lisand);
}

 </script>
</head>

<body onload="algus()">
  <div>
	  <select id="tyybivalik">
		  <option>rand</option>
		  <option>park</option>
		  <option>muuseum</option>
	  </select>
	  <input type="text" id="kast1" />
  </div>

<div id="kaardikiht"></div>

</body>
</html>
