<!DOCTYPE html>
<html>
 <head>
 <title>Kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
 <script>
   var kaart;
   var hypik;
	var tabeliKohad = [];
	var jooned = [];
   function algus(){
    kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);
	hypik = L.marker([59.439, 24.773]);
    new L.TileLayer('https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
      {attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
        tms: true,
      }).addTo(kaart);

    kaart.on("click", vajutus);
	fetch("https://script.google.com/macros/s/AKfycbxp-TobJITs3Eehm8eJq5dj4DWbR7G_0jpgKEktHYYjgoXUrMyeVbtApr6wR2yHLV5h/exec").then(d => d.json()).then(kuva);
  	
   }
	 
  function kuva(kohad){

    // Salvestame tabelis olevad kohad muutujasse
    tabeliKohad = kohad;

    for(let koht of kohad){
        L.marker([koht[0], koht[1]])
          .addTo(kaart)
          .bindPopup(koht[2]);
    }
}
	  
function vajutus(e){

  // Paneme kasutaja valitud markeri kaardile
  hypik
    .setLatLng(e.latlng)
    .addTo(kaart);
	
// Kustutame vanad jooned
for(let joon of jooned){
    kaart.removeLayer(joon);
}

jooned = [];


// Teeme joone kasutaja valitud kohast iga tabelis oleva kohani
for(let koht of tabeliKohad){

    let joon = L.polyline([
        e.latlng,
        [koht[0], koht[1]]
    ]).addTo(kaart);

    jooned.push(joon);
}
  // Paneme koordinaadid muutujatesse
  let laiuskraad = e.latlng.lat;
  let pikkuskraad = e.latlng.lng;

  // popup tekst
  let tekst =
    "Sinu valitud koht:" +
    "<br>Laiuskraad: " + laiuskraad +
    "<br>Pikkuskraad: " + pikkuskraad +
    "<br><br>";

  // Arvutame kauguse iga tabelis oleva kohani
  for(let koht of tabeliKohad){
    let kaugus = kaart.distance(
      e.latlng,
      L.latLng(koht[0], koht[1])
    );

    tekst = tekst +
      "<b>" + koht[2] + "</b>: " +
      Math.round(kaugus) + " m<br>";
  }

  // Tulemused
  hypik
    .bindPopup(tekst)
    .openPopup();

  // Andmed Sheetsi
  let lisand =
    "laiuskraad=" + laiuskraad +
    "&pikkuskraad=" + pikkuskraad +
    "&tyyp=" + tyybivalik.value +
    "&kommentaar=" + encodeURI(kast1.value);
  console.log(lisand);
  fetch(
    "https://script.google.com/macros/s/AKfycbxp-TobJITs3Eehm8eJq5dj4DWbR7G_0jpgKEktHYYjgoXUrMyeVbtApr6wR2yHLV5h/exec?" + lisand
  );
}

 </script>
</head>

<body onload="algus()">
  <div>
	  <select id="tyybivalik">
		  <option>rand</option>
		  <option>park</option>
		  <option>muuseum</option>
	  </select>
	  <input type="text" id="kast1" />
  </div>

<div id="kaardikiht"></div>

</body>
</html>
